[project]
name = "dcedl"
version = "0.2.0"
description = "Media downloader for DiscordChatExporter JSON exports"
readme = "README.md"
authors = [
    { name = "eldritchT", email = "e7toss@proton.me" }
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
dcedl = "dcedl:main"

[project.optional-dependencies]
socks = [
    "pysocks>=1.7.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
